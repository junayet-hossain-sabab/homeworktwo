<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework Two</title>

    <!-- All link Start -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- All link End -->

    <!-- INTERNAL CSS START  -->
    <style>
      span {
        color: tomato;
      }
    </style>
    <!-- INTERNAL CSS END  -->
  </head>
  <body>
    <center>
      <!-- INLINE CSS START  -->
      <h1 style="color: teal">HOME<span>WO</span>RK TWO</h1>
      <!-- INLINE CSS END  -->
      <form action="#" method="post">
        <h3>Your Name</h3>
        <input type="text" placeholder="Your Name" />
        <h3>Your Number</h3>
        <input type="number" placeholder="Your Number" />
        <h3>Your Email</h3>
        <input type="email" placeholder="Your E-mail" />
        <h3>Your Password</h3>
        <input type="password" placeholder="Password" />
        <h3>Your DOB</h3>
        <input type="date" />
        <h3>Gender</h3>
        <input type="radio" name="gender" />Male
        <input type="radio" name="gender" />Female
        <input type="radio" name="gender" />Other
        <h3>Hobby</h3>
        <input type="checkbox" />Tour <input type="checkbox" />Coding
        <input type="checkbox" />Sleep
        <h3>Fevourite Color</h3>
        <input type="color" />
        <h3>Upload photo</h3>
        <input type="file" />
        <h3>Your Country</h3>
        <select>
          <option>Bangladesh</option>
          <option>India</option>
          <option>Pakistan</option>
          <option>United State</option>
        </select>
        <h3>Your Address</h3>
        <textarea placeholder="Type Your Address Here"></textarea>
        <button type="button">Submit</button>
      </form>
      <h2>Google MAP</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d59103.15565034091!2d92.17537962925473!3d22.204111717255323!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30ad6a188414e62b%3A0xa4c3198f81ba90d0!2sBandarban!5e0!3m2!1sen!2sbd!4v1793109992262!5m2!1sen!2sbd"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </center>
  </body>
</html>
